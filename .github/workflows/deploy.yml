name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
   build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
      - name: Zainstaluj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Zainstaluj zależności projektu
        run: npm install
      - name: Zbuduj projekt
        run: npm run build
      - name: Przygotuj GitHub Pages
        uses: actions/configure-pages@v4
      - name: Wgraj pliki na serwer
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Opublikuj stronę
        id: deployment
        uses: actions/deploy-pages@v4